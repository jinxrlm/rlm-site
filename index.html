<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Pins relative URLs to the site root. Required because SPA routes are deep
     (/release/x.html) — without it those pages resolve assets against their own
     path. Static on purpose: a script-assigned href lands too late for the
     browser's preload scanner, which is a race that 404s the stylesheets. -->
<base href="/">
<title>Real Life Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Sans:wdth,wght@75,100..700&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="assets/style.css">
<link rel="stylesheet" type="text/css" href="assets/cursed.css">
<script src="assets/cursed.js"> </script>

</head>
<body>

<!-- start page -->
<div id="page-home" class="page active">
  <div class="hero" id="hero" onclick="heroClick()">
    <!-- bg image: full bleed atmospheric, always present -->
    <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-inner">
        <!-- text: bottom left -->
        <div class="hero-left">
          <img class="hero-logo" id="hero-logo" src="gfx/rlm_logo_main.png" alt="Real Life Music"/>
          <div class="hero-text" id="hero-text"></div>
        </div>
        <!-- cover: tilted, bleeds below -->
        <div class="hero-cover-wrap" id="hero-cover-wrap"></div>
      </div>
  </div>

  <div class="main">
    <div class="section-label">Artists</div>
    <div class="artists-grid" id="artists-grid"></div>

    <div class="section-label">About</div>
    <div class="about">
      <p class="about-text" id="about-text"></p>
    </div>
    <div class="footer">
      <img src="assets/rlm_orng.png" alt="Small RLMS logo" />
      <div>© 2018–2026 Real Life Music Sweden. All rights reserved.
      Contact: hello (at) reallifemusic.org | pr (at) reallifemusic.org</div>
    </div>
  </div>
</div>

<!-- artist page -->
<div id="page-artist" class="page">
  <div class="main">
    <div class="artist-page-hero" id="artist-hero"></div>
    <div class="section-label">Releases</div>
    <div class="releases-grid" id="artist-releases"></div>
    <div class="footer">
      <img src="assets/rlm_orng.png" alt="Small RLMS logo" />
      <div>© 2018–2026 Real Life Music Sweden. All rights reserved.
      Contact: hello (at) reallifemusic.org | pr (at) reallifemusic.org</div>
    </div>
  </div>
</div>

<!-- release page -->
<div id="page-release" class="page">
  <div class="main">
    <div class="release-page-layout" id="release-layout"></div>
  </div>
</div>

<!-- nav overlay -->
<div class="nav-overlay" id="nav-overlay">
  <div id="overlay-items"></div>
</div>

<!-- arrow symbol -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="arrow" viewBox="0 0 48 48">
      <path d="M24 8 L38 22 L30 22 L30 30 L18 30 L18 22 L10 22 Z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<!-- float pair -->
<div class="float-pair">
  <button class="float-btn" onclick="showHome()" title="Home">⌂</button>
  <button class="float-btn" onclick="openOverlay()" data-burger title="Menu">☰</button>
  <button class="float-btn float-btn-back" id="float-back" title="Back" style="display:none">
    <svg width="18" height="18" style="transform:rotate(270deg)"><use href="#arrow"/></svg>
  </button>
</div>

<script>
// ── editorial constants ──────────────────────────────────────────────────────
const ABOUT = 'Real Life Music Sweden is an independent label releasing music across Dub, Jungle, Amapiano, Downtempo, and beyond. Home of Jinx, Ingen Annan, and Vadoro.';

// ── helpers ──────────────────────────────────────────────────────────────────

const ROMAN = {ix:'9',viii:'8',vii:'7',vi:'6',iv:'4',iii:'3',ii:'2',v:'5',i:'1'};

function acro(str) {
  const words = str.trim().split(/\s+/);
  const last = words[words.length - 1].toLowerCase();
  if (ROMAN[last]) words[words.length - 1] = ROMAN[last];
  return words
    .map(w => w.replace(/[^a-zA-Z0-9]/g, ''))
    .filter(w => w.length > 0)
    .map(w => w[0])
    .join('')
    .toLowerCase();
}

// URL slug from a title: full words, diacritics folded (å→a), spaces→_, rest dropped.
// Used for artist and release route URLs; acro() stays for hero art only.
function slug(str) {
  return str
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/\s+/g, '_')
    .replace(/[^a-z0-9_]/g, '')
    .replace(/_+/g, '_')
    .replace(/^_|_$/g, '');
}

// ── socials block — artist meta row, text only ───────────────────────────────
// accepts [{platform, url}], ["Name", …] or a bare string
function buildSocials(socials) {
  const wrap = document.createElement('div');
  wrap.className = 'artist-page-socials';

  const list = Array.isArray(socials) ? socials : [socials];
  list.forEach(entry => {
    const s = typeof entry === 'object' ? entry : { platform: entry, url: null };
    const a = document.createElement('a');
    a.className = 'social-link';
    a.textContent = s.platform;
    if (s.url) { a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; }
    wrap.appendChild(a);
  });

  return wrap;
}

// ── streaming block — release page, logo above label ─────────────────────────
// "Apple Music" → assets/sl_apple_music.png
function streamingLogoSrc(platform) {
  return 'assets/sl_' + platform.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '.png';
}

// accepts [{platform, url}] or a comma-separated string
function buildStreamingLinks(streaming) {
  const wrap = document.createElement('div');
  wrap.className = 'streaming-links';

  const list = Array.isArray(streaming)
    ? streaming
    : streaming.split(',').map(s => ({ platform: s.trim(), url: null }));

  list.forEach(entry => {
    const p = typeof entry === 'object' ? entry : { platform: entry, url: null };
    const a = document.createElement('a');
    a.className = 'streaming-link';
    if (p.url) { a.href = p.url; a.target = '_blank'; a.rel = 'noopener'; }

    const logo = document.createElement('img');
    logo.className = 'streaming-link-logo';
    logo.src = streamingLogoSrc(p.platform);
    logo.alt = '';
    logo.onerror = () => logo.remove(); // no logo file yet → label stands alone
    a.appendChild(logo);

    const label = document.createElement('span');
    label.className = 'streaming-link-label';
    label.textContent = p.platform;
    a.appendChild(label);

    wrap.appendChild(a);
  });

  return wrap;
}

// ── state ────────────────────────────────────────────────────────────────────
let DATA = null;

// The site is served at the server root both locally (dev/serve.py) and when
// published, so route URLs are built straight off "/".
const BASE_PATH = '/';

// ── boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  document.getElementById('float-back').onclick = () => history.back();
  try {
    const r = await fetch('data.json');
    DATA = await r.json();
  } catch (e) {
    console.error('Could not load data.json', e);
    return;
  }
  renderHome();      // build home content once; stays hidden if we route elsewhere
  routeFromURL();    // show the page the current URL points at
}

// Read the path (minus BASE_PATH) and show the matching page. No pushState —
// used on first load and on popstate, where the URL is already correct.
function routeFromURL() {
  let path = location.pathname;
  if (path.startsWith(BASE_PATH)) path = path.slice(BASE_PATH.length);
  path = path.replace(/\.html$/, '');   // .html is decorative — strip before decoding
  const [kind, key] = path.split('/');

  if (kind === 'artist') {
    const a = (DATA.artists || []).find(x => slug(x.name) === key);
    if (a) { showArtist(a, false); return; }
  }
  if (kind === 'release') {
    const r = (DATA.releases || []).find(x => slug(x.name) === key);
    if (r) { showRelease(r, false); return; }
  }
  showHome(false);
}

// Browser back/forward: re-render for the new URL, never push.
window.addEventListener('popstate', routeFromURL);

// ── home ─────────────────────────────────────────────────────────────────────
function renderHome() {
  renderHero();
  renderArtistCards();
  document.getElementById('about-text').textContent = DATA.about || ABOUT;
}

function renderHero() {
  const release   = (DATA.releases || []).find(r => r.hero);
  const coverWrap = document.getElementById('hero-cover-wrap');
  const text      = document.getElementById('hero-text');
  const heroBg    = document.getElementById('hero-bg');

  coverWrap.innerHTML = '';
  text.innerHTML = '';

  if (!release) {
    text.innerHTML = '<div class="hero-empty">No featured release</div>';
    return;
  }
  heroBg.style.backgroundImage = 'url(gfx/hero_' +acro(release.name) + '.png)';

  // cover — tilted square, bleeds below hero
  if (release.image) {
    const img = document.createElement('img');
    img.src = release.image;
    img.className = 'hero-cover';
    img.alt = release.name;
    coverWrap.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'hero-cover-placeholder';
    coverWrap.appendChild(ph);
  }

  // text — title + artist/year
  const title = document.createElement('div');
  title.className = 'hero-title';
  title.textContent = release.name;

  const sub = document.createElement('div');
  sub.className = 'hero-sub';
  const year = release.date ? release.date.slice(0, 4) : '';
  sub.textContent = [release.artist, year].filter(Boolean).join(' · ');

  text.appendChild(title);
  text.appendChild(sub);
}

function heroClick() {
  const release = (DATA.releases || []).find(r => r.hero);
  if (release) showRelease(release);
}

function renderArtistCards() {
  const grid = document.getElementById('artists-grid');
  grid.innerHTML = '';

  (DATA.artists || []).forEach(artist => {
    const card = document.createElement('div');
    card.className = 'artist-card';
    card.onclick = () => showArtist(artist);

    if (artist.logo) {
      const img = document.createElement('img');
      img.src = artist.logo;
      img.className = 'artist-card-logo';
      img.alt = artist.name;
      card.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'artist-card-logo-placeholder';
      card.appendChild(ph);
    }

    const body = document.createElement('div');
    body.className = 'artist-card-body';

    const name = document.createElement('div');
    name.className = 'artist-card-name';
    name.textContent = artist.name;
    body.appendChild(name);

    if (artist.genres) {
      const genres = document.createElement('div');
      genres.className = 'artist-card-genres';
      genres.textContent = Array.isArray(artist.genres)
        ? artist.genres.join(', ')
        : artist.genres;
      body.appendChild(genres);
    }

    const n = (DATA.releases || []).filter(r => r.artist === artist.name).length;
    const rel_no = document.createElement('div');
    rel_no.className = 'artist-card-rel_no';
    rel_no.textContent = n + (n === 1 ? ' release' : ' releases');
    body.appendChild(rel_no);

    card.appendChild(body);
    grid.appendChild(card);
  });
}

// ── artist page ───────────────────────────────────────────────────────────────
function showArtist(artist, push = true) {
  setPage('page-artist');
  setBack(true);
  if (push) history.pushState(null, '', BASE_PATH + 'artist/' + slug(artist.name) + '.html');

  const hero = document.getElementById('artist-hero');
  hero.innerHTML = '';

  if (artist.image) {
    const img = document.createElement('img');
    img.src = artist.image;
    img.className = 'artist-page-img';
    img.alt = artist.name;
    hero.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'artist-page-img-placeholder';
    hero.appendChild(ph);
  }

  const info = document.createElement('div');
  info.className = 'artist-page-info';

  const name = document.createElement('div');
  name.className = 'artist-page-name';
  name.textContent = artist.name;
  info.appendChild(name);

  // meta row: genres left, socials right
  const metaRow = document.createElement('div');
  metaRow.className = 'artist-page-meta-row';

  const genres = document.createElement('div');
  genres.className = 'artist-page-genres';
  genres.textContent = artist.genres
    ? (Array.isArray(artist.genres) ? artist.genres.join(', ') : artist.genres)
    : '';
  metaRow.appendChild(genres);

  if (artist.socials && artist.socials.length) {
    metaRow.appendChild(buildSocials(artist.socials));
  }

  info.appendChild(metaRow);

  if (artist.bio) {
    const bio = document.createElement('p');
    bio.className = 'artist-page-bio';
    bio.textContent = artist.bio;
    info.appendChild(bio);
  }

  hero.appendChild(info);

  // releases for this artist
  const relGrid = document.getElementById('artist-releases');
  relGrid.innerHTML = '';
  const artistReleases = (DATA.releases || [])
    .filter(r => r.artist === artist.name)
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  artistReleases.forEach(rel => {
    const card = document.createElement('div');
    card.className = 'release-card';
    card.onclick = () => showRelease(rel);

    if (rel.image) {
      const img = document.createElement('img');
      img.src = rel.image;
      img.className = 'release-card-img';
      img.alt = rel.name;
      card.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'release-card-img';
      card.appendChild(ph);
    }

    const body = document.createElement('div');
    body.className = 'release-card-body';

    const rname = document.createElement('div');
    rname.className = 'release-card-name';
    rname.textContent = rel.name;
    body.appendChild(rname);

    const meta = document.createElement('div');
    meta.className = 'release-card-meta';
    const year = rel.date ? rel.date.slice(0, 4) : '';
    meta.textContent = [rel.type, year].filter(Boolean).join(' · ');
    body.appendChild(meta);

    card.appendChild(body);
    relGrid.appendChild(card);
  });

  window.scrollTo(0, 0);
}

// ── release page ──────────────────────────────────────────────────────────────
const RELEASE_BLURB_TEMP = "This release has no description yet. It's probably just SO good that it's hard to put into words.";

function showRelease(release, push = true) {
  setPage('page-release');
  setBack(true);
  if (push) history.pushState(null, '', BASE_PATH + 'release/' + slug(release.name) + '.html');

  const layout = document.getElementById('release-layout');
  layout.innerHTML = '';

  // artwork
  if (release.image) {
    const img = document.createElement('img');
    img.src = release.image;
    img.className = 'release-page-img';
    img.alt = release.name;
    layout.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'release-page-img-placeholder';
    layout.appendChild(ph);
  }

  const info = document.createElement('div');
  info.className = 'release-page-info';

  // title
  const title = document.createElement('div');
  title.className = 'release-page-title';
  title.textContent = release.name;
  info.appendChild(title);

  // meta row: artist · year · type on left, streaming buttons on right
  const metaRow = document.createElement('div');
  metaRow.className = 'release-page-meta-row';

  const metaLeft = document.createElement('div');
  metaLeft.className = 'release-page-meta-left';

  if (release.artist) {
    const artistEl = document.createElement('span');
    artistEl.className = 'release-page-artist';
    artistEl.textContent = release.artist;
    artistEl.onclick = () => {
      const a = (DATA.artists || []).find(x => x.name === release.artist);
      if (a) showArtist(a);
    };
    metaLeft.appendChild(artistEl);
  }

  [release.date ? release.date.slice(0, 4) : null, release.type].forEach(bit => {
    if (!bit) return;
    const span = document.createElement('span');
    span.className = 'release-page-metabit';
    span.textContent = bit;
    metaLeft.appendChild(span);
  });

  metaRow.appendChild(metaLeft);
  info.appendChild(metaRow);

  // blurb
  const desc = document.createElement('p');
  desc.className = 'release-page-blurb';
  desc.id = acro(release.name) + '_blurb';
  desc.textContent = release.blurb || RELEASE_BLURB_TEMP;
  info.appendChild(desc);

  // streaming — below blurb
  if (release.streaming) {
    const streamLabel = document.createElement('div');
    streamLabel.className = 'section-label streaming-label';
    streamLabel.textContent = 'Stream now';
    info.appendChild(streamLabel);

    info.appendChild(buildStreamingLinks(release.streaming));
  }
  const footer = document.createElement('div');
  footer.className = 'footer';
  footer.innerHTML = `
    <img src="assets/rlm_orng.png" alt="Small RLMS logo">
    <div>© 2018–2026 Real Life Music Sweden. All rights reserved.
    Contact: hello (at) reallifemusic.org | pr (at) reallifemusic.org</div>
  `;
  info.appendChild(footer);

  layout.appendChild(info);

  window.scrollTo(0, 0);
  cursedInit('iam_blurb', 'Kill it with fire!');
}

// ── nav overlay ───────────────────────────────────────────────────────────────
function openOverlay() {
  const overlay = document.getElementById('nav-overlay');
  const items   = document.getElementById('overlay-items');
  items.innerHTML = '';

  // home
  const home = document.createElement('div');
  home.className = 'nav-overlay-item';
  home.textContent = 'Home';
  home.onclick = () => { closeOverlay(); showHome(); };
  items.appendChild(home);

  // one item per artist
  (DATA.artists || []).forEach(artist => {
    const item = document.createElement('div');
    item.className = 'nav-overlay-item';
    item.textContent = artist.name;
    item.onclick = () => { closeOverlay(); showArtist(artist); };
    items.appendChild(item);
  });

  overlay.classList.add('open');

  // close on outside click
  setTimeout(() => {
    document.addEventListener('click', outsideClose);
  }, 0);
}

function outsideClose(e) {
  const overlay = document.getElementById('nav-overlay');
  const burger  = document.querySelector('.float-btn[data-burger]');
  if (!overlay.contains(e.target) && e.target !== burger) {
    closeOverlay();
  }
}

function closeOverlay() {
  document.getElementById('nav-overlay').classList.remove('open');
  document.removeEventListener('click', outsideClose);
}

// ── routing ───────────────────────────────────────────────────────────────────
function setPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setBack(show) {
  document.getElementById('float-back').style.display = show ? '' : 'none';
}

function showHome(push = true) {
  setPage('page-home');
  setBack(false);
  if (push) history.pushState(null, '', BASE_PATH);
  window.scrollTo(0, 0);
}

// ── go ────────────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
